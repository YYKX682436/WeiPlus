name: 安卓单频道构建

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 创建 GitHub Release 并发送 APK
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取当前频道代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: always
          cache-read-only: false
          validate-wrappers: false

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: 准备构建配置
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: |
          set -e

          version_name="$(sed -n 's/^HCAT_VERSION_NAME=//p' gradle.properties | tail -n 1)"
          version_code="$(sed -n 's/^HCAT_VERSION_CODE=//p' gradle.properties | tail -n 1)"
          if ! printf '%s' "$version_name" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "正式版本号必须使用 gradle.properties 中的三段格式 x.y.z: ${version_name}"
            exit 1
          fi
          if ! printf '%s' "$version_code" | grep -Eq '^[0-9]+$' \
            || [ "$version_code" -le 0 ] || [ "$version_code" -gt 2147483647 ]; then
            echo "正式 versionCode 无效: ${version_code}"
            exit 1
          fi
          apk_name="Hchat-${version_name}-release-signed.apk"
          release_tag="v${version_name}"
          if [ "$PUBLISH_RELEASE" = "true" ] \
            && git ls-remote --exit-code --tags origin "refs/tags/${release_tag}" >/dev/null 2>&1; then
            echo "Release Tag 已存在，拒绝重复发布: ${release_tag}"
            exit 1
          fi

          echo "HCAT_RELEASE_TAG=${release_tag}" >> "$GITHUB_ENV"
          echo "HCAT_RELEASE_TITLE=${version_name}" >> "$GITHUB_ENV"
          echo "HCAT_APK_NAME=${apk_name}" >> "$GITHUB_ENV"

          git fetch --force --tags origin 'refs/tags/v*:refs/tags/v*' >/dev/null 2>&1 || true
          previous_change_tag="$(
            git tag --merged HEAD --list 'v*' \
              | grep -E '^v[0-9]+(\.[0-9]+){1,2}$' \
              | sort -V \
              | tail -n 1
          )"
          if [ -n "$previous_change_tag" ]; then
            change_log="$(git log "${previous_change_tag}..HEAD" --pretty=format:'- %s' || true)"
          else
            change_log="$(git log HEAD --pretty=format:'- %s' -n 50 || true)"
          fi
          if [ -z "$change_log" ]; then
            change_log="- 本次构建没有新的提交变更"
          fi
          {
            echo "HCAT_CHANGE_LOG<<HCAT_CHANGE_LOG_EOF"
            printf '%s\n' "$change_log"
            echo "HCAT_CHANGE_LOG_EOF"
          } >> "$GITHUB_ENV"

      - name: 准备源码构建配置
        run: |
          set -e
          sed -i '/android.aapt2FromMavenOverride/d' gradle.properties

      - name: 还原签名证书
        env:
          HCAT_KEYSTORE_BASE64: ${{ secrets.HCAT_KEYSTORE_BASE64 }}
        run: |
          set -e
          if [ -z "$HCAT_KEYSTORE_BASE64" ]; then
            echo "Missing secret: HCAT_KEYSTORE_BASE64"
            exit 1
          fi
          mkdir -p app/keystore
          echo "$HCAT_KEYSTORE_BASE64" | base64 -d > app/keystore/。。.jks

      - name: 构建当前频道 APK
        env:
          HCAT_KEYSTORE_PATH: ${{ github.workspace }}/app/keystore/。。.jks
          HCAT_APK_NAME: ${{ env.HCAT_APK_NAME }}
          HCAT_STORE_PASSWORD: ${{ secrets.HCAT_STORE_PASSWORD }}
          HCAT_KEY_ALIAS: ${{ secrets.HCAT_KEY_ALIAS }}
          HCAT_KEY_PASSWORD: ${{ secrets.HCAT_KEY_PASSWORD }}
        run: sh ./gradlew :app:assembleRelease --build-cache --parallel --no-watch-fs -x lintVitalAnalyzeRelease

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: Hchat-single-release
          path: dist/${{ env.HCAT_APK_NAME }}

      - name: 发布单频道发行版
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          tag="${HCAT_RELEASE_TAG}"
          title="${HCAT_RELEASE_TITLE}"
          apk_path="dist/${HCAT_APK_NAME}"

          notes_file="$(mktemp)"
          printf '%s\n' "${HCAT_CHANGE_LOG}" > "$notes_file"

          gh release create "$tag" \
            "${apk_path}#${HCAT_APK_NAME}" \
            --title "$title" \
            --notes-file "$notes_file" \
            --target "${GITHUB_REF_NAME}" \
            --latest

      - name: 推送 Telegram 私聊安装包
        if: ${{ success() && inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          set -e
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_CHAT_ID" ]; then
            echo "未配置 Telegram secrets，跳过推送"
            exit 0
          fi
          caption="$(
            printf 'Hchat %s\n\n更新说明:\n%s' \
              "${HCAT_RELEASE_TITLE}" \
              "${HCAT_CHANGE_LOG}"
          )"
          caption="$(printf '%s' "$caption" | awk 'BEGIN { limit = 1024 } { if (length(out) == 0) out = $0; else out = out "\n" $0 } END { if (length(out) > limit) out = substr(out, 1, limit - 3) "..."; print out }')"

          curl -fsS "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendDocument" \
            -F chat_id="${TG_CHAT_ID}" \
            -F caption="${caption}" \
            -F document=@"dist/${HCAT_APK_NAME}" >/dev/null
